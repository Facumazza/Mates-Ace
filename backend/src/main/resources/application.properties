spring.application.name=mates-ace-backend
server.port=8080

# H2 file-based (persiste entre reinicios)
spring.datasource.url=jdbc:h2:file:./data/matesace;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:matesace-dev-only-secret-change-in-production}
jwt.expiration=3600000

# CORS (en producción setear: CORS_ORIGINS=https://tudominio.com)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:*}

# MercadoPago
mp.access-token=${MP_ACCESS_TOKEN}
mp.success-url=http://localhost:5175/pago/exitoso
mp.failure-url=http://localhost:5175/pago/fallido
mp.pending-url=http://localhost:5175/pago/pendiente
