spring.application.name=mates-ace-backend
server.port=8080

# H2 file-based (persiste entre reinicios)
spring.datasource.url=jdbc:h2:file:./data/matesace;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:matesace-dev-only-secret-change-in-production}
jwt.expiration=3600000

# CORS (en producción setear: CORS_ORIGINS=https://tudominio.com)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:*}

# Mail (en producción setear MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:noreply@matesace.com}

# MercadoPago
mp.access-token=${MP_ACCESS_TOKEN}
mp.success-url=http://localhost:5175/pago/exitoso
mp.failure-url=http://localhost:5175/pago/fallido
mp.pending-url=http://localhost:5175/pago/pendiente

# Datos bancarios para transferencia CVU
bank.cvu=${BANK_CVU:}
bank.alias=${BANK_ALIAS:}
bank.name=${BANK_NAME:}
bank.holder=${BANK_HOLDER:}
